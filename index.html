<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的常用网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'STXingkai', '华文行楷', 'KaiTi', 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            font-weight: 300;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .daily-quote {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px 30px;
            margin: 20px auto;
            max-width: 800px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            color: #333;
        }

        .quote-text {
            font-size: 1.1em;
            line-height: 1.8;
            margin-bottom: 10px;
            color: #555;
            font-style: italic;
        }

        .quote-author {
            text-align: right;
            color: #667eea;
            font-size: 0.95em;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .section-title {
            color: white;
            font-size: 1.3em;
            margin: 30px 0 15px 0;
            text-align: center;
            font-weight: 400;
        }

        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-button {
            padding: 15px 30px;
            background: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 400;
            color: #667eea;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-decoration: none;
            display: inline-block;
            font-family: 'STXingkai', '华文行楷', 'KaiTi', 'Microsoft YaHei', Arial, sans-serif;
        }

        .tab-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .tab-button.active {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
        }

        .tab-button.external {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .tab-button.external:hover {
            background: linear-gradient(135deg, #fa71cd 0%, #c471f5 100%);
        }

        .iframe-container {
            background: white;
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            height: calc(100vh - 450px);
            min-height: 500px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 50px;
            color: #667eea;
            font-size: 1.3em;
            font-weight: 400;
        }

        .info {
            text-align: center;
            color: white;
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }
            
            .tab-button {
                padding: 12px 20px;
                font-size: 14px;
            }
            
            .iframe-container {
                height: calc(100vh - 500px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 我的学习与工作网站</h1>
            <p class="subtitle">知行渡</p>
        </header>

        <div class="daily-quote" id="dailyQuote">
            <div class="quote-text" id="quoteText">加载中...</div>
            <div class="quote-author" id="quoteAuthor"></div>
            <button class="refresh-btn" onclick="fetchQuote()">🔄 换一句</button>
        </div>

        <div class="section-title">📺 可嵌入网站</div>
        <div class="tabs">
            <button class="tab-button active" onclick="loadSite('https://www.bilibili.com', this)">
                📺 哔哩哔哩
            </button>
            <button class="tab-button" onclick="loadSite('https://www.cnki.net', this)">
                📖 中国知网
            </button>
            <button class="tab-button" onclick="loadSite('https://www.doubao.com', this)">
                🤖 豆包
            </button>
            <button class="tab-button" onclick="loadSite('https://www.chinawriter.com.cn', this)">
                ✍️ 中国作家网
            </button>
            <button class="tab-button" onclick="loadSite('https://stars.chromeexperiments.com', this)">
                ⭐ 10万颗星星
            </button>
        </div>

        <div class="loading" id="loading">⏳ 加载中...</div>

        <div class="iframe-container">
            <iframe id="mainFrame" src="https://www.bilibili.com" title="网页内容"></iframe>
        </div>

        <div class="section-title">🚀 外部网站</div>
        <div class="tabs">
            <a class="tab-button external" href="https://www.zhihu.com" target="_blank">
                💬 知乎 ↗
            </a>
            <a class="tab-button external" href="https://node2.jimgen.com/" target="_blank">
                🤖 极梦AI ↗
            </a>
            <a class="tab-button external" href="https://chat.deepseek.com" target="_blank">
                🧠 DeepSeek ↗
            </a>
            <a class="tab-button external" href="https://lib.xust.edu.cn" target="_blank">
                ⏳ 西科大图书馆 ↗
            </a>
            <a class="tab-button external" href="https://www.gushiwen.cn" target="_blank">
                📜 古诗文网 ↗
            </a>
            <a class="tab-button external" href="https://www.icourses.cn" target="_blank">
                🎓 爱课程 ↗
            </a>
            <a href="/sitian/" class="sitian-btn">
                司天日晷推步仪 ↗
            </a>
            <a class="tab-button external" href="https://www.icourse163.org" target="_blank">
                📚 中国慕课大学 ↗
            </a>
            <a class="tab-button external" href="https://www.webofscience.com" target="_blank">
                🔬 Web of Science ↗
            </a>
            <a class="tab-button external" href="https://github.com" target="_blank">
                💻 GitHub ↗
            </a>
        </div>
    </div>

    <script>
        // 从API获取每日名言
        async function fetchQuote() {
            const quoteText = document.getElementById('quoteText');
            const quoteAuthor = document.getElementById('quoteAuthor');
            
            try {
                quoteText.textContent = '加载中...';
                quoteAuthor.textContent = '';
                
                // 使用免费的名言API
                const response = await fetch('https://v1.hitokoto.cn/?c=d&c=i&c=k');
                const data = await response.json();
                
                quoteText.textContent = `"${data.hitokoto}"`;
                quoteAuthor.textContent = data.from ? `—— ${data.from}` : '—— 佚名';
            } catch (error) {
                // 如果API失败，使用备用名言库
                const fallbackQuotes = [
                    { text: "读万卷书，行万里路。", author: "刘彝" },
                    { text: "学而不思则罔，思而不学则殆。", author: "孔子" },
                    { text: "知之者不如好之者，好之者不如乐之者。", author: "孔子" },
                    { text: "书山有路勤为径，学海无涯苦作舟。", author: "韩愈" },
                    { text: "纸上得来终觉浅，绝知此事要躬行。", author: "陆游" },
                    { text: "黑发不知勤学早，白首方悔读书迟。", author: "颜真卿" },
                    { text: "路漫漫其修远兮，吾将上下而求索。", author: "屈原" },
                    { text: "博学之，审问之，慎思之，明辨之，笃行之。", author: "《礼记》" }
                ];
                const randomQuote = fallbackQuotes[Math.floor(Math.random() * fallbackQuotes.length)];
                quoteText.textContent = `"${randomQuote.text}"`;
                quoteAuthor.textContent = `—— ${randomQuote.author}`;
            }
        }

        // 页面加载时获取名言
        window.addEventListener('load', fetchQuote);

        function loadSite(url, button) {
            const iframe = document.getElementById('mainFrame');
            const loading = document.getElementById('loading');
            const buttons = document.querySelectorAll('.tab-button:not(.external)');
            
            // 移除所有按钮的active类
            buttons.forEach(btn => btn.classList.remove('active'));
            // 给当前按钮添加active类
            button.classList.add('active');
            
            // 显示加载提示
            loading.style.display = 'block';
            
            // 加载新网站
            iframe.src = url;
            
            // 监听加载完成
            iframe.onload = function() {
                loading.style.display = 'none';
            };
            
            // 设置超时隐藏加载提示
            setTimeout(() => {
                loading.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
